[project]
name = "mimoru-bot"
version = "2.5.0rc1"
description = "«Mimoru» — хранитель групп для Telegram"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.31.0",
  "SQLAlchemy[asyncio]>=2.0,<2.2",
  "asyncpg>=0.30,<1",
  "redis>=5,<7",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.7,<3",
  "structlog>=24,<26",
  "openpyxl>=3.1,<4",
  "pymorphy3>=2.0,<3",
  "pymorphy3-dicts-ru>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
