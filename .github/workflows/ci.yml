name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql+asyncpg://moderator:moderator@localhost:5432/moderator"
      REDIS_URL: "redis://localhost:6379/0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run checks
        run: |
          export BOT_TOKEN="123456789:ci_test_$(printf '%024d' 0)"
          ./scripts/check.sh
